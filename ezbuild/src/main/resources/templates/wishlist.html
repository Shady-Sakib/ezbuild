<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Wishlist')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: header}"></th:block>
<th:block th:replace="~{fragments/layout :: flash}"></th:block>
<main class="container page">
    <h1>Wishlist</h1>
    <div class="empty" th:if="${products.isEmpty()}"><h3>Nothing saved yet</h3><a class="btn" th:href="@{/products}">Browse parts</a></div>
    <div class="grid"><th:block th:each="p : ${products}"><th:block th:replace="~{fragments/layout :: card(${p})}"></th:block></th:block></div>
</main>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
<th:block th:replace="~{fragments/layout :: overlays}"></th:block>
</body>
</html>
