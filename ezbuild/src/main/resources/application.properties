spring.application.name=ezbuild
spring.profiles.default=local
# Secrets go in .env (git-ignored), loaded by ezbuild.DotEnv at startup.
# Real environment variables override it.

server.port=${PORT:1010}
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SECURE_COOKIES:false}
server.servlet.session.timeout=60m
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# ---- MongoDB (Atlas or the docker-compose replica set)
# Set the real URI in MONGODB_URI (.env or env var), never in this file.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ezbuild?replicaSet=rs0&directConnection=true}
spring.data.mongodb.auto-index-creation=true
# false = no replica set (no multi-document transactions; stock updates stay atomic)
ezbuild.mongo-transactions=${MONGO_TRANSACTIONS:true}

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

spring.web.resources.cache.cachecontrol.max-age=30d
spring.web.resources.chain.enabled=true
# Content-hashed CSS/JS URLs: browsers fetch a new copy whenever the file changes,
# unchanged files keep the 30-day cache.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**
spring.web.resources.chain.cache=${RESOURCE_CHAIN_CACHE:false}
spring.web.resources.chain.compressed=true
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# mail is optional: don't report the app as DOWN without an SMTP server
management.health.mail.enabled=false

# ---- EZBuild
ezbuild.base-url=${BASE_URL:http://localhost:1010}
ezbuild.upload-dir=${UPLOAD_DIR:uploads}
ezbuild.seed=${SEED:true}
ezbuild.seed-admin-password=${SEED_ADMIN_PASSWORD:Admin@123}
ezbuild.remember-me-key=${REMEMBER_ME_KEY:change-me-local-only-remember-key}
ezbuild.cors-origins=${CORS_ORIGINS:}

ezbuild.jwt.secret=${JWT_SECRET:bG9jYWwtb25seS1kZXYtc2VjcmV0LWNoYW5nZS1tZS0zMi1ieXRlcyE=}
ezbuild.jwt.access-minutes=15
ezbuild.jwt.refresh-days=7

ezbuild.shipping.inside=60
ezbuild.shipping.outside=100
ezbuild.payment.cod-fee=50
ezbuild.payment.reservation-minutes=30

ezbuild.sslcommerz.store-id=${SSLC_STORE_ID:}
ezbuild.sslcommerz.store-pass=${SSLC_STORE_PASS:}
ezbuild.sslcommerz.base=${SSLC_BASE:https://sandbox.sslcommerz.com}
ezbuild.sslcommerz.max-amount=500000

ezbuild.stripe.secret-key=${STRIPE_SECRET_KEY:}
ezbuild.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
ezbuild.stripe.bdt-per-usd=${BDT_PER_USD:122}

# ---- AI assistant: local = Gemini inside this app, remote = the ezbuild-ai service
ezbuild.advisor.mode=${ADVISOR_MODE:local}
ezbuild.advisor.url=${ADVISOR_URL:http://localhost:1020}
ezbuild.advisor.key=${ADVISOR_KEY:local-dev-service-key}

# Spring AI + Google Gemini (AI Studio key). AI_PROVIDER=none runs without a key
# (the assistant then uses rule-based mode).
spring.ai.model.chat=${AI_PROVIDER:google-genai}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:missing-key}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-flash-latest}
spring.ai.google.genai.chat.temperature=0.3
# Turn Gemini's slow "thinking" step off for the assistant (unknown keys are ignored by older/newer Spring AI)
spring.ai.google.genai.chat.thinking-budget=${GEMINI_THINKING_BUDGET:0}
spring.ai.google.genai.chat.options.thinking-budget=${GEMINI_THINKING_BUDGET:0}
# Google Search grounding for comparisons and benchmarks (same Gemini key).
ezbuild.ai.web-search=${AI_WEB_SEARCH:true}

# ---- Mail (empty host = emails are only logged)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
ezbuild.mail-from=${MAIL_FROM:no-reply@ezbuild.app}

logging.level.ezbuild=INFO
spring.mvc.format.date=iso
