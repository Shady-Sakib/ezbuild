<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Orders · Admin')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: header}"></th:block>
<th:block th:replace="~{fragments/layout :: flash}"></th:block>
<main class="container admin">
    <nav th:replace="~{fragments/admin :: nav('orders')}"></nav>
    <section>
        <h1>Orders</h1>
        <form th:action="@{/admin/orders}" method="get" class="toolbar">
            <div style="display:flex;gap:8px">
                <input type="search" name="q" th:value="${q}" placeholder="Order code" style="width:200px">
                <select name="status" style="width:auto"><option value="">All statuses</option><option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}" th:selected="${s == status}"></option></select>
                <button class="btn ghost" type="submit">Filter</button>
            </div>
        </form>
        <div class="table-wrap">
            <table class="table">
                <thead><tr><th>Order</th><th>Customer</th><th>Date</th><th>Payment</th><th>Status</th><th style="text-align:right">Total</th></tr></thead>
                <tbody>
                <tr th:each="o : ${orders.content}">
                    <td><a class="link" th:href="@{/admin/orders/{c}(c=${o.code})}" th:text="${o.code}"></a> <span class="pill warn" th:if="${o.needsAttention}">!</span></td>
                    <td th:text="${o.username}"></td>
                    <td th:text="${@fmt.dateTime(o.createdAt)}"></td>
                    <td><span th:text="${o.paymentMethod.name()}"></span><br><small class="muted" th:text="${o.paymentStatus.label}"></small></td>
                    <td><span class="pill" th:classappend="${o.status.badge()}" th:text="${o.status.label}"></span></td>
                    <td style="text-align:right"><b th:text="${@fmt.tk(o.total)}"></b></td>
                </tr>
                </tbody>
            </table>
        </div>
        <nav class="pager" th:if="${orders.totalPages > 1}">
            <a th:each="i : ${#numbers.sequence(0, orders.totalPages - 1)}" th:href="@{/admin/orders(page=${i},status=${status},q=${q})}" th:text="${i + 1}" th:classappend="${i == orders.number} ? 'on'"></a>
        </nav>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: overlays}"></th:block>
</body>
</html>
