<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Forgot password')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: header}"></th:block>
<main class="auth">
    <div class="card">
        <h1>Reset your password</h1>
        <div class="flash success" th:if="${success}" th:text="${success}"></div>
        <div class="flash error" th:if="${error}" th:text="${error}"></div>
        <form th:action="@{/forgot-password}" method="post" style="margin-top:12px">
            <div class="field"><label for="email">Account email</label><input id="email" name="email" type="email" required></div>
            <button class="btn block" type="submit">Send reset link</button>
        </form>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
<th:block th:replace="~{fragments/layout :: overlays}"></th:block>
</body>
</html>
