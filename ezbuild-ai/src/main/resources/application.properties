spring.application.name=ezbuild-ai
server.port=${PORT:1020}
management.endpoints.web.exposure.include=health
ezbuildai.service-key=${ADVISOR_KEY:local-dev-service-key}
spring.ai.model.chat=${AI_PROVIDER:google-genai}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:missing-key}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-flash-latest}
spring.ai.google.genai.chat.temperature=0.3
