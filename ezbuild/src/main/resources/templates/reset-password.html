<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Choose a new password')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: header}"></th:block>
<main class="auth">
    <div class="card">
        <h1>Choose a new password</h1>
        <div th:if="${!valid}"><p>This link is invalid or has expired.</p><a class="btn" th:href="@{/forgot-password}">Request a new link</a></div>
        <form th:if="${valid}" th:action="@{/reset-password}" th:object="${form}" method="post">
            <input type="hidden" name="token" th:value="${token}">
            <div class="field" th:classappend="${#fields.hasErrors('newPassword')} ? 'has-error'"><label for="n">New password</label><input id="n" type="password" th:field="*{newPassword}" autocomplete="new-password"><div class="field-error" th:errors="*{newPassword}"></div></div>
            <div class="field" th:classappend="${#fields.hasErrors('passwordConfirmed')} ? 'has-error'"><label for="c">Confirm password</label><input id="c" type="password" th:field="*{confirmPassword}" autocomplete="new-password"><div class="field-error" th:errors="*{passwordConfirmed}"></div></div>
            <button class="btn block" type="submit">Save password</button>
        </form>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: footer}"></th:block>
<th:block th:replace="~{fragments/layout :: overlays}"></th:block>
</body>
</html>
